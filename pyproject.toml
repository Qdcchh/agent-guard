[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guard"
version = "0.0.1"
description = "Scaffold for verifiable delegation and controlled agent execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<3.3",
    "rfc8785==0.1.4",
    "tongsuopy==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: input boundary tests, no database required",
    "integration: requires a reachable test PostgreSQL",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
