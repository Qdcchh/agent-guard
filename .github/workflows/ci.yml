name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_guard_ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: agent_guard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_guard_ci -d agent_guard_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 25
          --label agent-guard.pr9-owner=${{ github.run_id }}-${{ github.run_attempt }}
      downstream-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_guard_ci
          POSTGRES_PASSWORD: ci-downstream-only-throwaway
          POSTGRES_DB: agent_guard_ci_downstream
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U agent_guard_ci -d agent_guard_ci_downstream"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 25
          --label agent-guard.pr9-owner=${{ github.run_id }}-${{ github.run_attempt }}
      audit-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_guard_ci
          POSTGRES_PASSWORD: ci-audit-only-throwaway
          POSTGRES_DB: agent_guard_ci_audit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_guard_ci -d agent_guard_ci_audit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 25
          --label agent-guard.pr9-owner=${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PR9_CI_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_GUARD_X402_ANVIL_BIN: ${{ github.workspace }}/dependencies/x402-20261017/vendor/anvil
      # Ephemeral CI service only; never reuse these credentials for deployment.
      AGENT_GUARD_TEST_DATABASE_URL: postgresql://agent_guard_ci:ci-only-throwaway@127.0.0.1:5432/agent_guard_ci
      AGENT_GUARD_A31_TEST_DOWNSTREAM_DATABASE_URL: postgresql://agent_guard_ci:ci-downstream-only-throwaway@127.0.0.1:5434/agent_guard_ci_downstream
      AGENT_GUARD_A31_TEST_AUDIT_DATABASE_URL: postgresql://agent_guard_ci:ci-audit-only-throwaway@127.0.0.1:5433/agent_guard_ci_audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require trusted repository code for private historical inputs
        env:
          PR9_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PR9_ACTOR: ${{ github.actor }}
        run: |
          test "$PR9_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$PR9_ACTOR" != 'dependabot[bot]'
      - name: Set job-local evidence paths after the runner is available
        run: |
          echo "A32_EXPORT_TLS_DIR=$RUNNER_TEMP/pr9-ci/export-tls" >> "$GITHUB_ENV"
          echo "A31_TEST_EVIDENCE_DIR=$RUNNER_TEMP/pr9-ci/a31" >> "$GITHUB_ENV"
          echo "AG31_SERVICE_EVIDENCE_DIR=$RUNNER_TEMP/pr9-ci/ag31" >> "$GITHUB_ENV"
          echo "PR9_DEPLOY_INPUTS_ROOT=$RUNNER_TEMP/pr9-ci/deployment-owners" >> "$GITHUB_ENV"
          echo "AG33_EVIDENCE_DIR=$RUNNER_TEMP/pr9-ci/installation-evidence" >> "$GITHUB_ENV"
          echo "PR9_CAPACITY_INPUTS_ROOT=$RUNNER_TEMP/pr9-ci/capacity-inputs" >> "$GITHUB_ENV"
      - name: Reserve time for cleanup within the complete job budget
        run: echo "PR9_CI_TEST_DEADLINE=$(( $(date +%s) + 340 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the documented reproduction shell and verify controller tools
        run: |
          sudo timeout 600 apt-get update
          sudo timeout 600 apt-get install -y --no-install-recommends zsh
          zsh --version
          docker compose version
          docker buildx version
          openssl version
      - name: Prepare the original HTTPS test domains on this ephemeral runner
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          printf '127.0.0.1 audit.agent-guard.test\n127.0.0.2 gateway.agent-guard.test\n' | sudo tee -a /etc/hosts >/dev/null
          python - <<'PY'
          import os
          import socket
          assert os.geteuid() != 0, 'permission tests require the real nonroot runner'
          for host, address in [('audit.agent-guard.test', '127.0.0.1'),
                                ('gateway.agent-guard.test', '127.0.0.2')]:
              actual = {r[4][0] for r in socket.getaddrinfo(host, 443, socket.AF_INET,
                                                          socket.SOCK_STREAM)}
              assert actual == {address}, 'fixed test domain mapping differs'
              with socket.socket() as listener:
                  listener.bind((address, 443))
          PY
      - name: Install exact runtime and development locks
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements-x402.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Prepare independently owned audit TLS and private evidence directories
        env:
          PR9_AUDIT_CONTAINER_ID: ${{ job.services['audit-postgres'].id }}
          PR9_CI_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          umask 077
          mkdir -p "$A31_TEST_EVIDENCE_DIR" "$AG31_SERVICE_EVIDENCE_DIR" \
            "$PR9_DEPLOY_INPUTS_ROOT" "$AG33_EVIDENCE_DIR"
          chmod 700 "$RUNNER_TEMP/pr9-ci" "$A31_TEST_EVIDENCE_DIR" \
            "$AG31_SERVICE_EVIDENCE_DIR" "$PR9_DEPLOY_INPUTS_ROOT" "$AG33_EVIDENCE_DIR"
          python tools/pr9_ci_audit_tls.py --container-id "$PR9_AUDIT_CONTAINER_ID" \
            --owner "$PR9_CI_OWNER" --tls-root "$RUNNER_TEMP/pr9-audit-tls"
          python - <<'PY'
          import os
          from pathlib import Path
          from tests.integration.test_gateway_tls import certificates
          directory = Path(os.environ['A32_EXPORT_TLS_DIR'])
          assert not any(p.is_symlink() for p in (directory, *directory.parents))
          directory.mkdir(mode=0o700)
          certificates(directory)
          for path in directory.iterdir():
              path.chmod(0o600)
          PY
      - name: Fetch the fixed public ciphertext without credentials
        run: |
          umask 077
          python -m tools.pr9_capacity_fetch \
            --manifest dependencies/pr9-capacity/source-manifest.json \
            --metadata dependencies/pr9-capacity/transport.json \
            --output-root "$RUNNER_TEMP/pr9-ci/ciphertext"
      - name: Authenticate and unpack private historical inputs
        env:
          AG32_CAPACITY_KEY: ${{ secrets.AG32_CAPACITY_KEY }}
        run: |
          umask 077
          test -n "$AG32_CAPACITY_KEY"
          python -m tools.pr9_capacity_transport unpack \
            --manifest dependencies/pr9-capacity/source-manifest.json \
            --metadata dependencies/pr9-capacity/transport.json \
            --ciphertext "$RUNNER_TEMP/pr9-ci/ciphertext/ciphertext.aesgcm" \
            --output-root "$RUNNER_TEMP/pr9-ci/decoded" --key-env AG32_CAPACITY_KEY
      - name: Bind all frozen inputs to the actual current noneditable installation
        run: |
          umask 077
          pr9_site_packages=$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          python tools/pr9_capacity_inputs.py prepare \
            --historical-binding "$RUNNER_TEMP/pr9-ci/decoded/historical-root/source-binding.json" \
            --historical-root "$RUNNER_TEMP/pr9-ci/decoded/historical-root" \
            --installed-root "$pr9_site_packages" --output-root "$PR9_CAPACITY_INPUTS_ROOT" \
            --container-root /capacity/inputs --container-installed-root /opt/runtime/lib/python3.11/site-packages
          python tools/pr9_capacity_inputs.py bind-installed \
            --binding "$PR9_CAPACITY_INPUTS_ROOT/host-binding.json" \
            --installed-root "$pr9_site_packages" --expected-source-root "$GITHUB_WORKSPACE/src" \
            --output "$PR9_CAPACITY_INPUTS_ROOT/current-consumer-binding.json"
          echo "AG32_FIXED_CAPACITY_DEPENDENCY=$PR9_CAPACITY_INPUTS_ROOT/current-consumer-binding.json" >> "$GITHUB_ENV"
      - name: Build the threshold test binary with the verified Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --manifest-path tools/threshold_demo/Cargo.toml
      - name: Verify the pinned local EVM and payment sources
        run: |
          echo "00f97668e1ae0fcca118fd7d2d1b6d25c0496447a523ca6bc2dfd10958c99604  $AGENT_GUARD_X402_ANVIL_BIN" | sha256sum --check
          python dependencies/x402-20261017/tools/verify_sources.py
          "$AGENT_GUARD_X402_ANVIL_BIN" --version
      - name: Create denial-probe role in the ephemeral test cluster only
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['AGENT_GUARD_TEST_DATABASE_URL']) as conn:
              conn.execute('CREATE ROLE br_s1_untrusted NOLOGIN NOSUPERUSER NOCREATEDB '
                           'NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS')
              conn.execute('GRANT br_s1_untrusted TO agent_guard_ci '
                           'WITH ADMIN FALSE, INHERIT FALSE, SET TRUE')
          from agent_guard.tools.downstream import MockDownstream
          MockDownstream(
              os.environ['AGENT_GUARD_A31_TEST_DOWNSTREAM_DATABASE_URL'],
              service_secret='test-only-downstream-service-secret',
          ).provision()
          PY
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Check presentation JavaScript and frontend behavior
        run: |
          node --check web/teacher-demo/app.js
          node tests/test_teacher_demo_frontend_logic.cjs
      - name: All nonintegration tests, including every top-level B test
        run: |
          pr9_remaining_seconds=$(( PR9_CI_TEST_DEADLINE - $(date +%s) ))
          test "$pr9_remaining_seconds" -gt 0
          timeout --signal=TERM --kill-after=30s "${pr9_remaining_seconds}s" \
            python tools/pr9_ci_run.py --root "$RUNNER_TEMP/pr9-ci/nonintegration" -- \
            python -m pytest tests --ignore=tests/integration
      - name: Bundle migrations and idempotent repeat
        run: |
          python -m agent_guard.ledger.migrate --bundle
          python -m agent_guard.ledger.migrate --bundle
      - name: All integration tests (real PostgreSQL, must not skip)
        run: |
          pr9_remaining_seconds=$(( PR9_CI_TEST_DEADLINE - $(date +%s) ))
          test "$pr9_remaining_seconds" -gt 0
          timeout --signal=TERM --kill-after=30s "${pr9_remaining_seconds}s" \
            python tools/pr9_ci_run.py --root "$RUNNER_TEMP/pr9-ci/integration" \
            --require-no-skips -- python -m pytest tests/integration
      - name: Always reclaim only recorded CI deployment owners and private inputs
        if: always()
        run: |
          cleanup_status=0
          if test -d "$PR9_DEPLOY_INPUTS_ROOT"; then
            python tools/pr9_deploy_inputs.py --root "$PR9_DEPLOY_INPUTS_ROOT" \
              --cleanup-all --installation-evidence-root "$AG33_EVIDENCE_DIR" || cleanup_status=$?
          fi
          # These fresh job-local paths are never uploaded or cached. Keep unknown
          # deployment identities for the strict cleanup error, then remove inputs.
          PR9_CLEANUP_STATUS="$cleanup_status" python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pr9-ci'
          names = ['decoded', 'capacity-inputs', 'ciphertext', 'nonintegration',
                   'integration', 'a31', 'ag31', 'export-tls']
          if os.environ['PR9_CLEANUP_STATUS'] == '0':
              names += ['deployment-owners', 'installation-evidence']
          for name in names:
              path = root / name
              if any(p.is_symlink() for p in (path, *path.parents)):
                  raise SystemExit('refusing linked CI cleanup target')
              if path.exists():
                  shutil.rmtree(path)
          tls = Path(os.environ['RUNNER_TEMP']) / 'pr9-audit-tls'
          if any(p.is_symlink() for p in (tls, *tls.parents)):
              raise SystemExit('refusing linked TLS cleanup target')
          if tls.exists():
              shutil.rmtree(tls)
          PY
          exit "$cleanup_status"
